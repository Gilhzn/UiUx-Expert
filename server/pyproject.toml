[project]
name = "adaptiveui-blueprint-service"
version = "0.1.0"
description = "Blueprint generation service for AdaptiveUI AI. Receives a DOM skeleton (no text/PII) and returns a JSON Blueprint of resilient-anchor transforms."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "redis>=5.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
