<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>AdaptiveUI AI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>AdaptiveUI AI</h1>
    <div id="site-info"></div>
  </header>
  <section id="autonomy-banner" class="autonomy-banner" hidden>
    <span class="autonomy-dot"></span>
    <span class="autonomy-text">מצב אוטונומי פעיל — המערכת לומדת ומתאימה אוטומטית</span>
  </section>
  <section class="site-toggle">
    <label class="toggle">
      <input type="checkbox" id="site-enabled">
      <span>הפעל באתר זה</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="autonomy-toggle">
      <span>מצב אוטונומי (גלובלי)</span>
    </label>
  </section>
  <section class="transforms">
    <h2>טרנספורמציות</h2>
    <ul id="transforms-list"></ul>
  </section>
  <section class="suggestions" id="suggestions-section" hidden>
    <h2>הצעות אישיות</h2>
    <div id="suggestions-list"></div>
  </section>
  <section class="custom-rules" id="custom-rules-section" hidden>
    <h2>כללים מותאמים לאתר</h2>
    <ul id="custom-rules-list"></ul>
  </section>
  <section class="apply-status" id="apply-status-section" hidden>
    <h2>מה השתנה כרגע</h2>
    <ul id="apply-status-list"></ul>
    <div id="apply-status-issues" hidden></div>
  </section>
  <section class="actions">
    <button id="open-options">הגדרות UX DNA</button>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
